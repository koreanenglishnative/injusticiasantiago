<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blood-drip">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0a0a12" rx="12"/>

  <!-- Three pillars: DIOS, LIBERTAD, JUSTICIA -->
  <!-- Pillar 1: DIOS - cracked and crushed -->
  <rect x="120" y="280" width="100" height="180" fill="#c9a84c" opacity="0.3" rx="4"/>
  <rect x="120" y="280" width="100" height="60" fill="#c9a84c" opacity="0.6" rx="4"/>
  <line x1="140" y1="280" x2="180" y2="340" stroke="#8b1a1a" stroke-width="3" opacity="0.8"/>
  <line x1="200" y1="290" x2="160" y2="350" stroke="#8b1a1a" stroke-width="2" opacity="0.7"/>
  <text x="170" y="430" text-anchor="middle" fill="#c9a84c" font-family="Georgia, serif" font-size="22" font-weight="bold">DIOS</text>

  <!-- Pillar 2: LIBERTAD - crushed flat under boot -->
  <rect x="340" y="300" width="120" height="160" fill="#c9a84c" opacity="0.2" rx="4"/>
  <rect x="340" y="300" width="120" height="30" fill="#c9a84c" opacity="0.4" rx="4"/>
  <line x1="350" y1="300" x2="420" y2="330" stroke="#8b1a1a" stroke-width="4" opacity="0.9"/>
  <line x1="450" y1="305" x2="380" y2="335" stroke="#8b1a1a" stroke-width="3" opacity="0.7"/>
  <text x="400" y="430" text-anchor="middle" fill="#c9a84c" font-family="Georgia, serif" font-size="22" font-weight="bold">LIBERTAD</text>

  <!-- Pillar 3: JUSTICIA -->
  <rect x="580" y="290" width="100" height="170" fill="#c9a84c" opacity="0.3" rx="4"/>
  <rect x="580" y="290" width="100" height="45" fill="#c9a84c" opacity="0.5" rx="4"/>
  <line x1="590" y1="290" x2="650" y2="335" stroke="#8b1a1a" stroke-width="3" opacity="0.8"/>
  <line x1="670" y1="295" x2="610" y2="340" stroke="#8b1a1a" stroke-width="2" opacity="0.6"/>
  <text x="630" y="430" text-anchor="middle" fill="#c9a84c" font-family="Georgia, serif" font-size="22" font-weight="bold">JUSTICIA</text>

  <!-- THE BOOT - stomping down on LIBERTAD -->
  <!-- Boot sole -->
  <path d="M280,300 L520,290 L530,275 L540,290 L540,310 L520,320 L280,320 Z" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  <!-- Boot treads -->
  <line x1="300" y1="310" x2="300" y2="320" stroke="#444" stroke-width="3"/>
  <line x1="330" y1="308" x2="330" y2="320" stroke="#444" stroke-width="3"/>
  <line x1="360" y1="306" x2="360" y2="320" stroke="#444" stroke-width="3"/>
  <line x1="390" y1="304" x2="390" y2="320" stroke="#444" stroke-width="3"/>
  <line x1="420" y1="302" x2="420" y2="320" stroke="#444" stroke-width="3"/>
  <line x1="450" y1="300" x2="450" y2="318" stroke="#444" stroke-width="3"/>
  <line x1="480" y1="296" x2="480" y2="316" stroke="#444" stroke-width="3"/>
  <line x1="510" y1="293" x2="510" y2="314" stroke="#444" stroke-width="3"/>

  <!-- Boot body -->
  <path d="M280,300 L280,160 Q280,140 300,140 L340,140 L340,180 L380,180 L380,140 L440,140 Q460,140 460,160 L460,200 L520,200 L530,275 L540,290 L520,290 L280,300 Z" fill="#222" stroke="#444" stroke-width="2"/>
  <!-- Boot laces area -->
  <rect x="310" y="180" width="130" height="80" fill="#1a1a1a" rx="4"/>
  <line x1="330" y1="190" x2="420" y2="190" stroke="#555" stroke-width="2"/>
  <line x1="330" y1="205" x2="420" y2="205" stroke="#555" stroke-width="2"/>
  <line x1="330" y1="220" x2="420" y2="220" stroke="#555" stroke-width="2"/>
  <line x1="330" y1="235" x2="420" y2="235" stroke="#555" stroke-width="2"/>
  <line x1="330" y1="250" x2="420" y2="250" stroke="#555" stroke-width="2"/>

  <!-- MINISTERIO PUBLICO text on boot -->
  <text x="400" y="155" text-anchor="middle" fill="#cc0000" font-family="Impact, Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing="2">MINISTERIO</text>
  <text x="400" y="175" text-anchor="middle" fill="#cc0000" font-family="Impact, Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing="2">PUBLICO</text>

  <!-- Blood splatters -->
  <!-- Under boot -->
  <ellipse cx="350" cy="325" rx="40" ry="6" fill="#8b1a1a" opacity="0.8"/>
  <ellipse cx="420" cy="328" rx="30" ry="5" fill="#8b1a1a" opacity="0.7"/>
  <ellipse cx="480" cy="322" rx="25" ry="4" fill="#8b1a1a" opacity="0.6"/>

  <!-- Blood drips from pillars -->
  <path d="M155,340 Q157,360 155,380 Q153,390 158,395 Q160,400 155,400" fill="none" stroke="#8b1a1a" stroke-width="3" opacity="0.7"/>
  <circle cx="155" cy="405" r="4" fill="#8b1a1a" opacity="0.8"/>

  <path d="M380,330 Q382,350 380,370 Q378,385 383,390" fill="none" stroke="#8b1a1a" stroke-width="4" opacity="0.8"/>
  <circle cx="383" cy="395" r="5" fill="#8b1a1a" opacity="0.9"/>

  <path d="M430,332 Q428,355 430,375" fill="none" stroke="#8b1a1a" stroke-width="3" opacity="0.7"/>
  <circle cx="430" cy="380" r="4" fill="#8b1a1a" opacity="0.7"/>

  <path d="M615,335 Q617,355 615,375 Q613,385 618,392" fill="none" stroke="#8b1a1a" stroke-width="3" opacity="0.7"/>
  <circle cx="618" cy="397" r="4" fill="#8b1a1a" opacity="0.8"/>

  <!-- Splatter drops around impact -->
  <circle cx="300" cy="330" r="3" fill="#8b1a1a" opacity="0.6"/>
  <circle cx="500" cy="325" r="4" fill="#8b1a1a" opacity="0.7"/>
  <circle cx="320" cy="340" r="2" fill="#8b1a1a" opacity="0.5"/>
  <circle cx="460" cy="335" r="3" fill="#8b1a1a" opacity="0.6"/>
  <circle cx="280" cy="345" r="2" fill="#8b1a1a" opacity="0.4"/>
  <circle cx="520" cy="330" r="3" fill="#8b1a1a" opacity="0.5"/>

  <!-- Ground line -->
  <line x1="50" y1="460" x2="750" y2="460" stroke="#333" stroke-width="1"/>

  <!-- Title text at top -->
  <text x="400" y="50" text-anchor="middle" fill="#cc0000" font-family="Georgia, serif" font-size="14" letter-spacing="4" opacity="0.8">ASI TRATAN LOS DERECHOS FUNDAMENTALES</text>

  <!-- Subtitle -->
  <text x="400" y="490" text-anchor="middle" fill="#666" font-family="Georgia, serif" font-size="13" font-style="italic">&quot;Dios, Patria y Libertad&quot; - Lema de la Republica Dominicana</text>
</svg>