<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#0a0a12" rx="12"/>

  <!-- === STICK FIGURE: LIDIA (left) - lighter skin, brown hair === -->
  <!-- Head -->
  <circle cx="240" cy="120" r="28" fill="#f5d6b8" stroke="#d4a574" stroke-width="2"/>
  <!-- Brown hair -->
  <path d="M212,115 Q212,88 240,85 Q268,88 268,115" fill="#5c3317" stroke="none"/>
  <path d="M210,118 Q208,105 212,95" fill="none" stroke="#5c3317" stroke-width="8" stroke-linecap="round"/>
  <path d="M270,118 Q272,105 268,95" fill="none" stroke="#5c3317" stroke-width="8" stroke-linecap="round"/>
  <!-- Hair falling down -->
  <path d="M210,118 Q205,140 210,165" fill="none" stroke="#5c3317" stroke-width="6" stroke-linecap="round"/>
  <path d="M270,118 Q275,140 270,165" fill="none" stroke="#5c3317" stroke-width="6" stroke-linecap="round"/>
  <!-- Eyes - angry -->
  <circle cx="230" cy="118" r="3" fill="#333"/>
  <circle cx="250" cy="118" r="3" fill="#333"/>
  <line x1="224" y1="110" x2="234" y2="113" stroke="#333" stroke-width="2"/>
  <line x1="256" y1="110" x2="246" y2="113" stroke="#333" stroke-width="2"/>
  <!-- Mouth - speaking/commanding -->
  <ellipse cx="240" cy="135" rx="8" ry="5" fill="#333"/>
  <!-- Body -->
  <line x1="240" y1="148" x2="240" y2="260" stroke="#f5d6b8" stroke-width="5"/>
  <!-- Arms - pointing at child -->
  <line x1="240" y1="190" x2="290" y2="220" stroke="#f5d6b8" stroke-width="4"/>
  <line x1="290" y1="220" x2="340" y2="200" stroke="#f5d6b8" stroke-width="4"/>
  <line x1="240" y1="190" x2="190" y2="230" stroke="#f5d6b8" stroke-width="4"/>
  <!-- Legs -->
  <line x1="240" y1="260" x2="215" y2="340" stroke="#f5d6b8" stroke-width="4"/>
  <line x1="240" y1="260" x2="265" y2="340" stroke="#f5d6b8" stroke-width="4"/>
  <!-- Feet -->
  <line x1="215" y1="340" x2="200" y2="345" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <line x1="265" y1="340" x2="280" y2="345" stroke="#333" stroke-width="4" stroke-linecap="round"/>

  <!-- === STICK FIGURE: SPEDY (right) - dark skin, bald, muscular === -->
  <!-- Head - bald -->
  <circle cx="560" cy="110" r="30" fill="#3d2209" stroke="#2a1805" stroke-width="2"/>
  <!-- Eyes - menacing -->
  <circle cx="548" cy="108" r="3" fill="#ddd"/>
  <circle cx="572" cy="108" r="3" fill="#ddd"/>
  <line x1="542" y1="100" x2="554" y2="103" stroke="#ddd" stroke-width="2"/>
  <line x1="578" y1="100" x2="566" y2="103" stroke="#ddd" stroke-width="2"/>
  <!-- Mouth -->
  <ellipse cx="560" cy="125" rx="7" ry="4" fill="#222"/>
  <!-- Body - thicker for muscular -->
  <line x1="560" y1="140" x2="560" y2="255" stroke="#3d2209" stroke-width="7"/>
  <!-- Broad shoulders -->
  <line x1="520" y1="160" x2="600" y2="160" stroke="#3d2209" stroke-width="6" stroke-linecap="round"/>
  <!-- Arms - crossed/threatening -->
  <line x1="520" y1="160" x2="490" y2="200" stroke="#3d2209" stroke-width="5"/>
  <line x1="490" y1="200" x2="460" y2="210" stroke="#3d2209" stroke-width="5"/>
  <line x1="600" y1="160" x2="630" y2="200" stroke="#3d2209" stroke-width="5"/>
  <line x1="630" y1="200" x2="610" y2="230" stroke="#3d2209" stroke-width="5"/>
  <!-- Legs -->
  <line x1="560" y1="255" x2="530" y2="340" stroke="#3d2209" stroke-width="5"/>
  <line x1="560" y1="255" x2="590" y2="340" stroke="#3d2209" stroke-width="5"/>
  <!-- Feet -->
  <line x1="530" y1="340" x2="515" y2="345" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <line x1="590" y1="340" x2="605" y2="345" stroke="#222" stroke-width="5" stroke-linecap="round"/>

  <!-- === CHILD - small, cowering, scared === -->
  <!-- Head -->
  <circle cx="400" cy="230" r="20" fill="#e8c9a0" stroke="#c9a574" stroke-width="1.5"/>
  <!-- Short hair -->
  <path d="M380,225 Q380,208 400,205 Q420,208 420,225" fill="#3d2209"/>
  <!-- Eyes - wide with fear, tears -->
  <circle cx="393" cy="228" r="4" fill="#fff"/>
  <circle cx="393" cy="228" r="2.5" fill="#333"/>
  <circle cx="407" cy="228" r="4" fill="#fff"/>
  <circle cx="407" cy="228" r="2.5" fill="#333"/>
  <!-- Tears -->
  <path d="M387,232 Q385,242 387,250" fill="none" stroke="#4488cc" stroke-width="2" opacity="0.8"/>
  <circle cx="387" cy="252" r="2" fill="#4488cc" opacity="0.7"/>
  <path d="M413,232 Q415,242 413,250" fill="none" stroke="#4488cc" stroke-width="2" opacity="0.8"/>
  <circle cx="413" cy="252" r="2" fill="#4488cc" opacity="0.7"/>
  <!-- Mouth - open, crying -->
  <ellipse cx="400" cy="242" rx="5" ry="4" fill="#333"/>
  <!-- Body - small, hunched -->
  <line x1="400" y1="250" x2="400" y2="310" stroke="#e8c9a0" stroke-width="3"/>
  <!-- Arms - covering self, defensive -->
  <line x1="400" y1="270" x2="375" y2="290" stroke="#e8c9a0" stroke-width="3"/>
  <line x1="375" y1="290" x2="385" y2="310" stroke="#e8c9a0" stroke-width="3"/>
  <line x1="400" y1="270" x2="425" y2="290" stroke="#e8c9a0" stroke-width="3"/>
  <line x1="425" y1="290" x2="415" y2="310" stroke="#e8c9a0" stroke-width="3"/>
  <!-- Legs - crouching -->
  <line x1="400" y1="310" x2="385" y2="345" stroke="#e8c9a0" stroke-width="3"/>
  <line x1="400" y1="310" x2="415" y2="345" stroke="#e8c9a0" stroke-width="3"/>

  <!-- Speech bubble from adults -->
  <rect x="200" y="20" width="400" height="70" rx="12" fill="#fff" stroke="#cc0000" stroke-width="2" filter="url(#shadow)"/>
  <polygon points="380,90 400,105 420,90" fill="#fff" stroke="#cc0000" stroke-width="2"/>
  <line x1="381" y1="89" x2="419" y2="89" stroke="#fff" stroke-width="3"/>
  <text x="400" y="48" text-anchor="middle" fill="#cc0000" font-family="Arial, sans-serif" font-size="15" font-weight="bold">&quot;TIENES QUE MENTIR POR NOSOTROS</text>
  <text x="400" y="72" text-anchor="middle" fill="#cc0000" font-family="Arial, sans-serif" font-size="15" font-weight="bold">PARA QUE NO VAYAMOS A LA CARCEL&quot;</text>

  <!-- Fear lines around child -->
  <line x1="360" y1="210" x2="350" y2="200" stroke="#cc0000" stroke-width="1.5" opacity="0.5"/>
  <line x1="365" y1="260" x2="350" y2="265" stroke="#cc0000" stroke-width="1.5" opacity="0.5"/>
  <line x1="440" y1="210" x2="450" y2="200" stroke="#cc0000" stroke-width="1.5" opacity="0.5"/>
  <line x1="435" y1="260" x2="450" y2="265" stroke="#cc0000" stroke-width="1.5" opacity="0.5"/>
  <line x1="370" y1="235" x2="355" y2="235" stroke="#cc0000" stroke-width="1.5" opacity="0.4"/>
  <line x1="430" y1="235" x2="445" y2="235" stroke="#cc0000" stroke-width="1.5" opacity="0.4"/>

  <!-- Labels -->
  <text x="240" y="370" text-anchor="middle" fill="#aaa" font-family="Arial, sans-serif" font-size="12">LIDIA NAVARRETE</text>
  <text x="560" y="370" text-anchor="middle" fill="#aaa" font-family="Arial, sans-serif" font-size="12">EXPEDITO V. RODRIGUEZ</text>
  <text x="240" y="385" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="10" font-style="italic">la querellante</text>
  <text x="560" y="385" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="10" font-style="italic">&quot;Expedito&quot;</text>

  <!-- Bottom question -->
  <text x="400" y="425" text-anchor="middle" fill="#cc0000" font-family="Georgia, serif" font-size="22" font-weight="bold" font-style="italic">&#191;Puedes escuchar el llanto del ni&#241;o?</text>

  <!-- Bottom CTA -->
  <rect x="175" y="450" width="450" height="40" rx="8" fill="#cc0000" opacity="0.9"/>
  <text x="400" y="476" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">PRUEBA CLARA DE MALTRATO INFANTIL POR LOS TUTORES</text>
</svg>